# Collaudi su GitHub Actions (docs/PROPOSTA-COLLAUDI-SU-GITHUB.md, 1 novembre 2026).
# Lancia tests/lancia_tutti.sh con Chromium e Firefox, diviso in 4 pezzi per browser (8 computer insieme).
# Parte di notte (circa alle 3 italiane) solo se nelle ultime 24 ore c'è stato almeno un commit su main (dal 1 al 3 novembre 2026 provava il ramo pulizia),
# e a mano dalla scheda Actions («Run workflow», con la scelta del giro veloce). Non parte a ogni push:
# in una sessione se ne fanno molti (Ale, 1 novembre 2026).
# Non scrive niente nel repository e non usa chiavi né password.
name: Collaudi

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      veloce:
        description: "Solo il giro --veloce (salta i collaudi lunghi)"
        type: boolean
        default: false
      solo:
        description: "Solo i collaudi il cui nome contiene questo testo (per esempio: non_partite); vuoto = tutti"
        type: string
        default: ""
      semi_partenze:
        description: "Semi di collaudo_non_partite (per esempio 1-200); vuoto = 1-20"
        type: string
        default: ""

permissions:
  contents: read

# Un giro lanciato a mano ferma quello ancora in corso sullo stesso ramo.
concurrency:
  group: collaudi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  serve:
    name: Ci sono commit nuovi?
    runs-on: ubuntu-24.04
    outputs:
      lancia: ${{ steps.conta.outputs.lancia }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: conta
        run: |
          n=$(git log --since="24 hours ago" --oneline | wc -l)
          echo "commit nelle ultime 24 ore: $n"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$n" -gt 0 ]; then
            echo "lancia=si" >> "$GITHUB_OUTPUT"
          else
            echo "lancia=no" >> "$GITHUB_OUTPUT"
          fi

  collaudi:
    needs: serve
    if: needs.serve.outputs.lancia == 'si'
    name: ${{ matrix.browser }} ${{ matrix.parte }}/4
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
        parte: [1, 2, 3, 4]
    steps:
      - name: Codice con tutta la storia (quattro collaudi confrontano con versioni vecchie)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node come sul PC (v20.19.2)
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.2"

      - name: Python come sul PC (3.13)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Playwright 1.60.0 e il browser (come tests/prepara_ambiente.sh)
        run: |
          python -m venv .venv-collaudi
          .venv-collaudi/bin/pip install --quiet "playwright==1.60.0"
          .venv-collaudi/bin/playwright install --with-deps ${{ matrix.browser }}

      - name: ffmpeg per collaudo_suoni_si_sentono.py (misura solo in Chromium)
        if: matrix.browser == 'chromium'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Collaudi
        env:
          BROWSER: ${{ matrix.browser }}
          SOLO: ${{ inputs.solo }}
          SEMI_PARTENZE: ${{ inputs.semi_partenze }}
        run: |
          OPZ="--parte ${{ matrix.parte }}/4 --parallelo 2"
          if [ "${{ inputs.veloce }}" = "true" ]; then OPZ="$OPZ --veloce"; fi
          if [ -n "$SOLO" ]; then OPZ="$OPZ --solo $SOLO"; fi
          if [ -n "$SEMI_PARTENZE" ]; then export NONPARTITE_SEMI="$SEMI_PARTENZE"; fi
          set +e
          tests/lancia_tutti.sh $OPZ 2>&1 | tee riepilogo.txt
          esito=${PIPESTATUS[0]}
          {
            echo "### ${{ matrix.browser }}, pezzo ${{ matrix.parte }}/4 (uscita $esito)"
            echo '```'
            sed -n '/^FALLITI:$/,$p' riepilogo.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $esito

      - name: Niente scritto nel repository (criterio G6)
        if: always()
        run: |
          git status --porcelain --untracked-files=all -- . ':!riepilogo.txt' > "$RUNNER_TEMP/cambiati.txt"
          if [ -s "$RUNNER_TEMP/cambiati.txt" ]; then echo "File cambiati o nuovi dopo i collaudi:"; cat "$RUNNER_TEMP/cambiati.txt"; exit 1; fi
          echo "nessun file cambiato"

      - name: Uscite complete come allegato
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collaudi-${{ matrix.browser }}-${{ matrix.parte }}
          path: |
            riepilogo.txt
            tests/output/
          retention-days: 30
          if-no-files-found: warn
